<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quem é o Famoso?</title>
    <style>
        body {
            background-color: #00ff00; /* Fundo verde para usar Chroma Key no OBS se precisar */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .game-container {
            position: relative;
            width: 500px; /* Largura da foto */
            height: 500px; /* Altura da foto */
            border: 5px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* A foto do famoso no fundo */
        .celebrity-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('famoso.jpg');
            background-size: cover;
            background-position: center;
        }

        /* A grade de quadrados que vai cobrir a foto */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            /* Cria uma grade de 10x10 (100 quadrados) */
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .square {
            background-color: #1a1a1a;
            border: 1px solid #333;
            transition: opacity 0.3s ease;
        }

        /* Classe que o JS vai adicionar para esconder o quadrado */
        .hidden {
            opacity: 0;
        }

        /* Mensagem de Vencedor */
        .winner-banner {
            position: absolute;
            bottom: -80px;
            width: 100%;
            text-align: center;
            background: #ffcc00;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            display: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="celebrity-photo"></div>
        <div class="grid-overlay" id="grid"></div>
        <div class="winner-banner" id="winner">Vencedor: <span id="winner-name"></span>!</div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const totalSquares = 100; // 10x10
        let squaresArray = [];

        // 1. Criar os quadrados
        for (let i = 0; i < totalSquares; i++) {
            const square = document.createElement('div');
            square.classList.add('square');
            grid.appendChild(square);
            squaresArray.push(square);
        }

        // 2. Embaralhar a ordem dos quadrados para eles sumirem de forma aleatória
        squaresArray.sort(() => Math.random() - 0.5);

        // 3. Função para remover um quadrado a cada 1 segundo
        let currentIndex = 0;
        const revealInterval = setInterval(() => {
            if (currentIndex < squaresArray.length) {
                squaresArray[currentIndex].classList.add('hidden');
                currentIndex++;
            } else {
                clearInterval(revealInterval); // Para quando todos sumirem
            }
        }, 1000); // 1000 milissegundos = 1 segundo por quadrado

        // (Futuro) Função que o Bot vai chamar quando alguém acertar
        function someoneWon(playerName) {
            clearInterval(revealInterval); // Para o cronômetro
            // Some com todos os quadrados restantes de uma vez
            squaresArray.forEach(sq => sq.classList.add('hidden')); 
            
            // Mostra o nome do vencedor
            document.getElementById('winner-name').innerText = playerName;
            document.getElementById('winner').style.display = 'block';
        }
    </script> <!-- FECHAMOS O SCRIPT AQUI -->

    <!-- ADICIONAMOS O LINK DO SOCKET.IO AQUI NO HTML -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- ABRIMOS UM NOVO SCRIPT SÓ PARA A CONEXÃO -->
    <script>
        // Conecta o HTML com o servidor Node.js
        const socket = io();

        // Fica esperando o servidor avisar que alguém acertou
        socket.on('temosVencedor', (dados) => {
            someoneWon(dados.vencedor);
        });
    </script>
</body>
</html>
