<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quem é o Famoso?</title>
    <style>
        body {
            background-color: #00ff00; /* Fundo verde para Chroma Key */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 90vw; 
            max-width: 500px;
            aspect-ratio: 1 / 1;
            border: 5px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 50px; 
        }

        .timer-display {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff004f; 
            padding: 5px 25px;
            border-radius: 15px;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        .celebrity-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .square {
            background-color: #1a1a1a;
            border: 1px solid #333;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
        }

        .winner-banner {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            background: #ffcc00;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            border-radius: 10px;
            z-index: 20;
            box-sizing: border-box;
        }

        .celebrity-name {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 30px;
            font-weight: 900;
            text-shadow: 3px 3px 10px #000000;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="timer-display" id="tempo">0s</div>
        <div class="celebrity-photo" id="foto-fundo"></div>
        <div class="grid-overlay" id="grid"></div>
        <div class="winner-banner" id="winner">Vencedor: <span id="winner-name"></span>!</div>
        <div class="celebrity-name" id="nome-famoso"></div>
    </div>
    
    <script>
        const grid = document.getElementById('grid');
        const totalSquares = 100; // 10x10
        let squaresArray = [];

        // 1. Lista sequencial com os 14 famosos
        const listaDeFamosos = [
            { arquivo: 'Ana Castela.jpg', nome: 'Ana Castela' },
            { arquivo: 'anitta.jpg', nome: 'Anitta' },
            { arquivo: 'cr7.jpg', nome: 'Cristiano Ronaldo' },
            { arquivo: 'Haaland.jpg', nome: 'Erling Haaland' },
            { arquivo: 'Gustavo lima.jpg', nome: 'Gusttavo Lima' },
            { arquivo: 'Lamine Yamal.jpg', nome: 'Lamine Yamal' },
            { arquivo: 'messi.jpg', nome: 'Lionel Messi' },
            { arquivo: 'Marilia Mendonça.jpg', nome: 'Marília Mendonça' },
            { arquivo: 'Natanzinho lima.jpg', nome: 'Natanzinho Lima' },
            { arquivo: 'neymar.jpg', nome: 'Neymar Jr.' },
            { arquivo: 'Ronaldinho Gaúcho.jpg', nome: 'Ronaldinho Gaúcho' },
            { arquivo: 'ronaldo.jpg', nome: 'Ronaldo Fenômeno' },
            { arquivo: 'vinijr.jpg', nome: 'Vini Jr.' },
            { arquivo: 'Zé felipe.jpg', nome: 'Zé Felipe' }
        ];

        // 2. Recupera a posição atual na fila (começa no 0 = Ana Castela)
        let indiceAtual = parseInt(localStorage.getItem('indiceFamoso')) || 0;
        if (indiceAtual >= listaDeFamosos.length || indiceAtual < 0) {
            indiceAtual = 0;
        }

        const famosoAtual = listaDeFamosos[indiceAtual];

        // 3. Aplica a foto e prepara o nome do famoso da vez
        document.getElementById('foto-fundo').style.backgroundImage = `url('${famosoAtual.arquivo}')`;
        document.getElementById('nome-famoso').innerText = famosoAtual.nome;

        // 4. Cria e embaralha os quadrados
        for (let i = 0; i < totalSquares; i++) {
            const square = document.createElement('div');
            square.classList.add('square');
            grid.appendChild(square);
            squaresArray.push(square);
        }
        squaresArray.sort(() => Math.random() - 0.5);

        // 5. Cronômetro e remoção dos quadrados
        let currentIndex = 0;
        let tempoDecorrido = 0; 
        let jogoAcabou = false;
        
        const revealInterval = setInterval(() => {
            if (currentIndex < squaresArray.length && !jogoAcabou) {
                squaresArray[currentIndex].classList.add('hidden');
                currentIndex++;
                
                tempoDecorrido++;
                document.getElementById('tempo').innerText = tempoDecorrido + "s";
            } else if (!jogoAcabou) {
                clearInterval(revealInterval); 
                document.getElementById('nome-famoso').style.display = 'block';
                jogoAcabou = true;
            }
        }, 500); // Velocidade: 500ms por quadrado (altere se quiser mais rápido/lento)

        // 6. Revela a resposta e trava o tempo
        function someoneWon(playerName) {
            if (jogoAcabou) return;
            jogoAcabou = true;

            clearInterval(revealInterval); 
            squaresArray.forEach(sq => sq.classList.add('hidden')); 
            
            document.getElementById('winner-name').innerText = playerName;
            document.getElementById('winner').style.display = 'block';
            document.getElementById('nome-famoso').style.display = 'block'; 

            document.getElementById('tempo').style.backgroundColor = "#00ffcc";
            document.getElementById('tempo').style.color = "#000000";
        }

        // 7. Salva o próximo índice da fila e recarrega para o próximo famoso
        function avancarProximoFamoso() {
            const proximoIndice = (indiceAtual + 1) % listaDeFamosos.length;
            localStorage.setItem('indiceFamoso', proximoIndice);
            location.reload();
        }
    </script> 

    <script src="/socket.io/socket.io.js"></script>

    <script>
        // Celular: 1º toque revela, 2º toque vai para o próximo da lista
        document.addEventListener('click', () => {
            if (!jogoAcabou) {
                someoneWon('Você?');
            } else {
                avancarProximoFamoso();
            }
        });

        // PC: 1º Espaço revela, 2º Espaço vai para o próximo da lista
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                if (!jogoAcabou) {
                    someoneWon('Você?');
                } else {
                    avancarProximoFamoso();
                }
            }

            // Atalho opcional (tecla R): volta para o 1º famoso da lista
            if (event.code === 'KeyR') {
                localStorage.setItem('indiceFamoso', 0);
                location.reload();
            }
        });
        
        // Conexão com o bot da live (para quando for usar ao vivo)
        try {
            const socket = io();
            socket.on('temosVencedor', (dados) => {
                someoneWon(dados.vencedor);
            });
        } catch (e) {
            console.log("Modo offline para gravação.");
        }
    </script>
</body>
</html>
