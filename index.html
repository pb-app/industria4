<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quem é o Famoso?</title>
    <style>
        body {
            background-color: #00ff00; /* Fundo verde para usar Chroma Key no OBS se precisar */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .game-container {
            position: relative;
            width: 500px; /* Largura da foto */
            height: 500px; /* Altura da foto */
            border: 5px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* A foto do famoso no fundo */
        .celebrity-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* A grade de quadrados que vai cobrir a foto */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            /* Cria uma grade de 10x10 (100 quadrados) */
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .square {
            background-color: #1a1a1a;
            border: 1px solid #333;
            transition: opacity 0.3s ease;
        }

        /* Classe que o JS vai adicionar para esconder o quadrado */
        .hidden {
            opacity: 0;
        }

        /* Mensagem de Vencedor */
        .winner-banner {
            position: absolute;
            bottom: -80px;
            width: 100%;
            text-align: center;
            background: #ffcc00;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            display: none;
            border-radius: 10px;
        }

        /* Estilo do nome do famoso que vai aparecer */
        .celebrity-name {
            position: absolute;
            top: 20px; /* Fica no topo da imagem */
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 40px;
            font-weight: 900;
            text-shadow: 3px 3px 10px #000000; /* Sombra preta para dar leitura fácil */
            display: none; /* Começa invisível */
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="celebrity-photo" id="foto-fundo"></div>
        <div class="grid-overlay" id="grid"></div>
        <div class="winner-banner" id="winner">Vencedor: <span id="winner-name"></span>!</div>
        <div class="celebrity-name" id="nome-famoso"></div>
    </div>
    
    <script>
        const grid = document.getElementById('grid');
        const totalSquares = 100; // 10x10
        let squaresArray = [];

        // 1. Lista com a foto e o nome exato do famoso
        const listaDeFamosos = [
            { arquivo: 'neymar.jpg', nome: 'Neymar Jr.' },
            { arquivo: 'messi.jpg', nome: 'Lionel Messi' },
            { arquivo: 'anitta.jpg', nome: 'Anitta' },
            { arquivo: 'cr7.jpg', nome: 'Cristiano Ronaldo' }
        ];

        // 2. O código escolhe um famoso aleatório dessa lista
        const famosoSorteado = listaDeFamosos[Math.floor(Math.random() * listaDeFamosos.length)];

        // 3. Aplica a foto no fundo e já deixa o nome dele preparado (mas escondido)
        document.getElementById('foto-fundo').style.backgroundImage = `url('${famosoSorteado.arquivo}')`;
        document.getElementById('nome-famoso').innerText = famosoSorteado.nome;

        // 4. Criar os quadrados
        for (let i = 0; i < totalSquares; i++) {
            const square = document.createElement('div');
            square.classList.add('square');
            grid.appendChild(square);
            squaresArray.push(square);
        }

        // 5. Embaralhar a ordem dos quadrados para eles sumirem de forma aleatória
        squaresArray.sort(() => Math.random() - 0.5);

        // 6. Função para remover um quadrado a cada 1 segundo
        let currentIndex = 0;
        const revealInterval = setInterval(() => {
            if (currentIndex < squaresArray.length) {
                squaresArray[currentIndex].classList.add('hidden');
                currentIndex++;
            } else {
                clearInterval(revealInterval); // Para quando todos sumirem
            }
        }, 500); // 1000 milissegundos = 1 segundo por quadrado

        // Função que é chamada quando alguém acerta (ou quando você aperta Espaço)
        function someoneWon(playerName) {
            clearInterval(revealInterval); 
            squaresArray.forEach(sq => sq.classList.add('hidden')); 
            
            document.getElementById('winner-name').innerText = playerName;
            document.getElementById('winner').style.display = 'block';
            
            // Faz o nome do famoso aparecer lindão na tela!
            document.getElementById('nome-famoso').style.display = 'block'; 
        }
    </script> 

    <!-- Link do Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // Truque para gravar vídeos: Aperta Espaço para revelar!
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                someoneWon('Você?'); // O nome que vai aparecer na tela
            }
        });
        
        // (Isso tenta conectar ao servidor, mas não quebra se estivermos apenas gravando a tela)
        try {
            const socket = io();
            socket.on('temosVencedor', (dados) => {
                someoneWon(dados.vencedor);
            });
        } catch (e) {
            console.log("Modo offline para gravação de vídeos curtos.");
        }
    </script>
</body>
</html>
