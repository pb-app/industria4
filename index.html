<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- A TAG MÁGICA: Diz para o celular não diminuir a tela e ajustar ao tamanho do aparelho -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quem é o Famoso?</title>
    <style>
        body {
            background-color: #00ff00; /* Fundo verde */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Evita que a tela crie barra de rolagem */
        }

        .game-container {
            position: relative;
            /* Alterado para responsivo: Ocupa 90% da largura do celular */
            width: 90vw; 
            max-width: 500px; /* Mantém o limite caso você abra no PC */
            aspect-ratio: 1 / 1; /* Garante que a foto continue um quadrado perfeito */
            border: 5px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 50px; 
        }

        /* O Cronômetro no topo da tela */
        .timer-display {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px; /* Tamanho da fonte ajustado para celular */
            font-weight: 900;
            color: #ffffff;
            background-color: #ff004f; 
            padding: 5px 25px;
            border-radius: 15px;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
            transition: background-color 0.3s;
            white-space: nowrap; /* Impede que o tempo quebre em duas linhas */
        }

        /* A foto do famoso no fundo */
        .celebrity-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* A grade de quadrados que vai cobrir a foto */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .square {
            background-color: #1a1a1a;
            border: 1px solid #333;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
        }

        /* Mensagem de Vencedor */
        .winner-banner {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            background: #ffcc00;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            border-radius: 10px;
            z-index: 20;
            box-sizing: border-box;
        }

        /* Estilo do nome do famoso que vai aparecer */
        .celebrity-name {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 30px;
            font-weight: 900;
            text-shadow: 3px 3px 10px #000000;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Aqui está a caixinha do tempo -->
        <div class="timer-display" id="tempo">0s</div>

        <div class="celebrity-photo" id="foto-fundo"></div>
        <div class="grid-overlay" id="grid"></div>
        <div class="winner-banner" id="winner">Vencedor: <span id="winner-name"></span>!</div>
        <div class="celebrity-name" id="nome-famoso"></div>
    </div>
    
    <script>
        const grid = document.getElementById('grid');
        const totalSquares = 60; // 10x10
        let squaresArray = [];

        // 1. Lista com a foto e o nome exato do famoso
        const listaDeFamosos = [
            { arquivo: 'neymar.jpg', nome: 'Neymar Jr.' },
            { arquivo: 'messi.jpg', nome: 'Lionel Messi' },
            { arquivo: 'anitta.jpg', nome: 'Anitta' },
            { arquivo: 'cr7.jpg', nome: 'Cristiano Ronaldo' }
            { arquivo: 'Haaland.jpg', nome: 'Haaland' }
        ];

        // 2. O código escolhe um famoso aleatório dessa lista
        const famosoSorteado = listaDeFamosos[Math.floor(Math.random() * listaDeFamosos.length)];

        // 3. Aplica a foto no fundo e já deixa o nome dele preparado
        document.getElementById('foto-fundo').style.backgroundImage = `url('${famosoSorteado.arquivo}')`;
        document.getElementById('nome-famoso').innerText = famosoSorteado.nome;

        // 4. Criar os quadrados
        for (let i = 0; i < totalSquares; i++) {
            const square = document.createElement('div');
            square.classList.add('square');
            grid.appendChild(square);
            squaresArray.push(square);
        }

        // 5. Embaralhar a ordem dos quadrados
        squaresArray.sort(() => Math.random() - 0.5);

        // 6. Variáveis do jogo e do tempo
        let currentIndex = 0;
        let tempoDecorrido = 0; 
        let jogoAcabou = false; // Controle para evitar travar duas vezes
        
        // 7. Função que remove quadrados e conta o tempo a cada 1 segundo
        const revealInterval = setInterval(() => {
            if (currentIndex < squaresArray.length && !jogoAcabou) {
                squaresArray[currentIndex].classList.add('hidden');
                currentIndex++;
                
                // Aumenta o tempo e atualiza na tela
                tempoDecorrido++;
                document.getElementById('tempo').innerText = tempoDecorrido + "s";
            } else if (!jogoAcabou) {
                // Acabou o tempo e as peças sumiram
                clearInterval(revealInterval); 
                document.getElementById('nome-famoso').style.display = 'block';
                jogoAcabou = true;
            }
        }, 1000); 

        // 8. Função de vitória
        function someoneWon(playerName) {
            if (jogoAcabou) return; // Se já acabou, não faz nada
            jogoAcabou = true;

            clearInterval(revealInterval); 
            squaresArray.forEach(sq => sq.classList.add('hidden')); 
            
            document.getElementById('winner-name').innerText = playerName;
            document.getElementById('winner').style.display = 'block';
            document.getElementById('nome-famoso').style.display = 'block'; 

            // Muda a cor do cronômetro para verde florescente
            document.getElementById('tempo').style.backgroundColor = "#00ffcc";
            document.getElementById('tempo').style.color = "#000000";
        }
    </script> 

    <!-- Link do Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // ATUALIZAÇÃO PARA CELULAR: Dá um toque na tela verde para travar o relógio!
        document.addEventListener('click', () => {
            someoneWon('Você?');
        });

        // Truque para gravar vídeos no PC (apertando a Barra de Espaço)
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                someoneWon('Você?');
            }
        });
        
        // Conexão com o servidor do Bot (Não interfere na gravação do celular)
        try {
            const socket = io();
            socket.on('temosVencedor', (dados) => {
                someoneWon(dados.vencedor);
            });
        } catch (e) {
            console.log("Modo offline para gravação.");
        }
    </script>
</body>
</html>
